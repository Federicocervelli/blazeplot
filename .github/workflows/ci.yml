name: CI

on:
  pull_request:
    branches:
      - main
      - v1
  # Pushes to main and v1 run CI only through the release workflow, right before it publishes.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests, build, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run check

  browser:
    name: Browser benchmark, visual, interaction, website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run test:browser
      # Always uploaded: `actual/` holds the candidate baselines rendered in this CI environment and
      # `diff/` the red-highlight diffs for failing cases. See docs/internal/local-development.md.
      - name: Upload visual test screenshots and baseline candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-tests
          path: build/visual-tests
          if-no-files-found: ignore
          retention-days: 14

  # Single required status check for branch protection; stays stable as jobs are added.
  validate:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        if: needs.checks.result != 'success' || needs.browser.result != 'success'
        run: exit 1
      - run: echo "All CI jobs passed."
