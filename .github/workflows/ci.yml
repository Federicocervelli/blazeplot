name: CI

on:
  pull_request:
  push:
    branches:
      - development
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests, build, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run check

  browser:
    name: Browser benchmark, visual, interaction, website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run test:browser
      - name: Upload visual test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests
          path: build/visual-tests
          if-no-files-found: ignore

  # Single required status check for branch protection; stays stable as jobs are added.
  validate:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        if: needs.checks.result != 'success' || needs.browser.result != 'success'
        run: exit 1
      - run: echo "All CI jobs passed."
