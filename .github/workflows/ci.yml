name: CI

on:
  pull_request:
    branches:
      - main
      - v1
  # Pushes to main and v1 run CI only through the release workflow, right before it publishes.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests, build, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run check

  # Installs the packed tarball into a consumer project with TypeScript 5.0.4 and the latest 5.x.
  # Not part of `bun run check` because it installs TypeScript from npm (needs network).
  typescript-floor:
    name: TypeScript 5.0 floor (packed consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run test:typescript-floor

  browser:
    name: Browser benchmark, visual, interaction, website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run test:browser
      # Always uploaded: `actual/` holds the candidate baselines rendered in this CI environment and
      # `diff/` the red-highlight diffs for failing cases. See docs/internal/local-development.md.
      - name: Upload visual test screenshots and baseline candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-tests
          path: build/visual-tests
          if-no-files-found: ignore
          retention-days: 14

  # Engine coverage beyond Chromium: WebGL2, non-blank rendering, and basic interaction in
  # Firefox and WebKit through Playwright. Not a replacement for the Chrome `browser` job.
  cross-browser:
    name: Cross-browser smoke (Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      # System dependencies are not part of the cache, so always run the install; it skips downloads that are cached.
      - name: Install Firefox and WebKit
        run: bunx playwright install --with-deps firefox webkit
      # Headless Firefox on Linux finds no GL driver; headed under Xvfb gets Mesa software WebGL2.
      - run: xvfb-run -a bun run test:cross-browser --headed firefox
      - name: Upload cross-browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-tests
          path: build/cross-browser
          if-no-files-found: ignore

  # Single required status check for branch protection; stays stable as jobs are added.
  validate:
    if: always()
    needs: [checks, typescript-floor, browser, cross-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        if: needs.checks.result != 'success' || needs.typescript-floor.result != 'success' || needs.browser.result != 'success' || needs.cross-browser.result != 'success'
        run: exit 1
      - run: echo "All CI jobs passed."
