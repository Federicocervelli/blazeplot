name: perf-noise-temp
on:
  pull_request:
    branches: [v1]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nproc; grep -m1 "model name" /proc/cpuinfo; free -m | head -2
      - run: bun run bench:gate -- --report-only --reps 11 --retry-reps 0 --discard 1
