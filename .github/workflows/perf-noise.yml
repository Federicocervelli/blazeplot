name: perf-noise-temp
on:
  pull_request:
    branches: [v1]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: grep -m1 "model name" /proc/cpuinfo
      - name: Real gate must pass
        run: bun run bench:gate
      - name: Gate with 2ms injected per frame must fail
        run: |
          if bun run bench:gate -- --inject-slowdown-ms 2 --out build/perf-gate/slow.json; then echo "GATE DID NOT FAIL"; exit 1; fi
          echo "gate failed as expected"
      - name: Gate with 1ms injected per frame (informational)
        run: bun run bench:gate -- --inject-slowdown-ms 1 --report-only --retry-reps 0 --out build/perf-gate/slow1.json
