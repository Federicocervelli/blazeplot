name: Pages

# Deploys for main come from the release workflow, so each merge deploys once and
# a release never ships a stable site built from the previous tag.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: branches/next
          fetch-depth: 0

      # The stable site documents the latest npm release, not unreleased work on main.
      - name: Resolve latest release tag
        id: release
        working-directory: branches/next
        run: |
          TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_OUTPUT"

      # A released site never changes, so only the first deploy after a release builds it.
      - name: Restore stable site
        id: stable-cache
        uses: actions/cache@v6
        with:
          path: branches/stable/build/pages
          key: pages-stable-${{ steps.release.outputs.sha }}

      - name: Checkout latest release
        if: steps.stable-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: branches/stable

      - if: steps.stable-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          working-directory: branches/stable

      - name: Build stable site
        if: steps.stable-cache.outputs.cache-hit != 'true'
        working-directory: branches/stable
        run: bun run pages:build

      - uses: ./.github/actions/setup
        with:
          working-directory: branches/next

      - name: Build next site
        working-directory: branches/next
        env:
          BLAZEPLOT_PAGES_BASE: /next/
        run: bun run pages:build

      - name: Assemble site
        run: |
          rm -rf build/pages
          mkdir -p build/pages/next
          cp -a branches/stable/build/pages/. build/pages/
          cp -a branches/next/build/pages/. build/pages/next/
          rm -rf build/pages/visual build/pages/interaction build/pages/next/visual build/pages/next/interaction
          mkdir -p build/pages/previews build/pages/next/previews
          cp build/pages/index.html build/pages/previews/index.html
          cp build/pages/next/index.html build/pages/next/previews/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
