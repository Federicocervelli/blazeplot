name: Pages

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Checkout main preview
        uses: actions/checkout@v7
        with:
          ref: main
          path: branches/main

      - name: Checkout development preview
        uses: actions/checkout@v7
        with:
          ref: development
          path: branches/development

      - uses: ./.github/actions/setup
        with:
          working-directory: branches/main

      - name: Build main site
        working-directory: branches/main
        run: bun run pages:build

      - uses: ./.github/actions/setup
        with:
          working-directory: branches/development

      - name: Build development site
        working-directory: branches/development
        env:
          BLAZEPLOT_PAGES_BASE: /development/
        run: bun run pages:build

      - name: Assemble site
        run: |
          rm -rf build/pages
          mkdir -p build/pages/development
          cp -a branches/main/build/pages/. build/pages/
          cp -a branches/development/build/pages/. build/pages/development/
          rm -rf build/pages/visual build/pages/interaction build/pages/development/visual build/pages/development/interaction
          mkdir -p build/pages/previews build/pages/development/previews
          cp build/pages/index.html build/pages/previews/index.html
          cp build/pages/development/index.html build/pages/development/previews/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
