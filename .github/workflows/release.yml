name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/setup

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; nothing to publish."
          elif npm view "blazeplot@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::blazeplot@${VERSION} is on npm but tag ${TAG} is missing."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Append release benchmark results
        if: steps.version.outputs.publish == 'true'
        run: bun run release:benchmarks -- --if-missing

      - name: Write release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          {
            if [ -f "changelogs/v${VERSION}.md" ]; then cat "changelogs/v${VERSION}.md"; printf '\n\n'; fi
            if [ -n "$PREV_TAG" ]; then
              echo "## Commits"
              echo
              git log --no-merges "${PREV_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
              echo
            fi
          } > release-notes.md

      # CI ran in separate jobs, so build the package here before packing it.
      - name: Build and pack
        if: steps.version.outputs.publish == 'true'
        run: |
          bun run build
          bun pm pack
          tar -tzf blazeplot-*.tgz | grep -qx 'package/dist/index.js' || { echo "::error::Packed tarball is missing dist/index.js"; exit 1; }

      # Authenticates with npm trusted publishing (OIDC); no npm token secret is needed.
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish ./blazeplot-*.tgz --provenance --access public

      - name: Tag and create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md

      # Release PRs are merged with a merge commit, so development is an ancestor of
      # main and can be fast-forwarded. This keeps both branches on the same commit.
      - name: Fast-forward development to main
        run: |
          git fetch origin development
          if git merge-base --is-ancestor origin/development HEAD; then
            git push origin HEAD:refs/heads/development
          else
            echo "::warning::development has commits that are not on main; merge main into development manually."
          fi
