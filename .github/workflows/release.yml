name: Release

on:
  push:
    branches:
      - main
      - v1
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap gate: decide whether this push publishes before spending time on CI.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      pages: ${{ steps.version.outputs.pages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read package version
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Channels: main publishes stable versions to npm "latest"; v1 publishes
          # 1.0.0-rc.N candidates to npm "rc". Anything else (a prerelease on main, a stable
          # version on v1 after merging main into it, any other branch) never publishes.
          # Pages deploys from main only.
          if [ "$BRANCH" = main ]; then echo "pages=true" >> "$GITHUB_OUTPUT"; else echo "pages=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            KIND=stable
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            KIND=rc
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported version ${VERSION}; expected x.y.z or x.y.z-rc.N."
            exit 1
          fi
          if { [ "$BRANCH" = main ] && [ "$KIND" = stable ]; } || { [ "$BRANCH" = v1 ] && [ "$KIND" = rc ]; }; then
            :
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION} (${KIND}) is not published from ${BRANCH}; main publishes stable versions and v1 publishes -rc.N versions."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; nothing to publish."
          elif npm view "blazeplot@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::blazeplot@${VERSION} is on npm but tag ${TAG} is missing."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Pull requests already passed CI on an up-to-date branch; rerun it only as a gate before publishing.
  ci:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    # pull-requests is read by CI's change-detection job; it is a no-op outside pull_request events.
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: [version, ci]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/setup

      - name: Append release benchmark results
        run: bun run release:benchmarks -- --if-missing

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Stable notes list commits since the last stable tag; rc notes since the last tag of any kind.
          EXCLUDE=()
          if [ "$PRERELEASE" != "true" ]; then EXCLUDE=(--exclude 'v*-*'); fi
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${EXCLUDE[@]}" HEAD^ 2>/dev/null || true)
          {
            if [ -f "changelogs/v${VERSION}.md" ]; then cat "changelogs/v${VERSION}.md"; printf '\n\n'; fi
            if [ -n "$PREV_TAG" ]; then
              echo "## Commits"
              echo
              git log --no-merges "${PREV_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
              echo
            fi
          } > release-notes.md

      # CI ran in separate jobs, so build the package here before packing it.
      - name: Build and pack
        run: |
          bun run build
          bun pm pack
          tar -tzf blazeplot-*.tgz | grep -qx 'package/dist/index.js' || { echo "::error::Packed tarball is missing dist/index.js"; exit 1; }

      # Authenticates with npm trusted publishing (OIDC); no npm token secret is needed.
      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: npm publish ./blazeplot-*.tgz --provenance --access public --tag "$NPM_TAG"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          FLAGS=()
          # Release candidates are pre-releases and must never become the repository's "Latest" release.
          if [ "$PRERELEASE" = "true" ]; then FLAGS=(--prerelease --latest=false); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"

  # The only Pages deploy for main: right away for ordinary merges, after the new tag exists for releases.
  # Never runs for v1: release candidates do not change the public site.
  pages:
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.pages == 'true' && (needs.version.outputs.publish == 'false' || needs.release.result == 'success') }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
